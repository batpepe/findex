[project]
name = "findex"
version = "1.0.0"
description = "A full-text and semantic search engine over the Python docs and PEPs, built in 8 labs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "batpepe", email = "oskostya25@gmail.com" }
]
keywords = ["search", "inverted-index", "bm25", "information-retrieval", "embeddings", "hybrid-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.3",
    "pydantic-settings>=2.16.1",
    "rich>=15.0.0",
    "selectolax>=1.0.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# semantic + hybrid search (Lab 8): ONNX Runtime runs all-MiniLM-L6-v2 without PyTorch
semantic = [
    "onnxruntime>=1.22",
    "tokenizers>=0.21",
]

[project.urls]
Repository = "https://github.com/batpepe/findex"

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.5",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]
# the corpus and tests are deliberately multilingual
allowed-confusables = ["σ", "ς", "Σ", "ι", "ʼ", "’", "‘", "＇", "і", "×"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["tests/data", "scripts/demo_gif.py"]  # PEP 723 scripts with their own dependencies
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["slow: takes more than a second (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover", "raise NotImplementedError"]
