name: Image

# Publishes the deployable image to GHCR: ghcr.io/batpepe/findex:<commit sha> on every push to
# main, plus :<version> for a release tag. The homelab cluster (batpepe/devops-homelab-k3s-hybrid-cloud,
# k8s-infrastructure/apps/findex) pins the commit-sha tag; ArgoCD rolls it out.
# Order matters: build -> Trivy gate -> smoke test -> push. A vulnerable or broken image is never published.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/batpepe/findex

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan for vulnerabilities (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test (health, search)
        run: |
          docker run -d --name findex -p 8000:8000 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS "http://127.0.0.1:8000/search?q=asyncio+TaskGroup&k=1" | grep -q '"total"'
          docker stop findex

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
          echo "pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
