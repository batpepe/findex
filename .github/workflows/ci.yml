name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "lab-*"]
  pull_request:

jobs:
  lint:
    name: ruff + pyright (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the normal build and the free-threaded (no-GIL) build - Lab 5 needs both
        python: ["3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term

  wheel:
    name: build + install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv build
      - run: uv tool install dist/*.whl && findex --version && findex --help
